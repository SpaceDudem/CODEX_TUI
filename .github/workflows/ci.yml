name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q codex_tui
      - name: Ruff
        run: ruff check codex_tui tests
      - name: Mypy
        run: mypy codex_tui

  live-schema-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Refresh live Codex schema and exercise composition catalog
        run: |
          codex-tui catalog --refresh-schema --search model_reasoning_summary | tee /tmp/catalog.txt
          grep -q "model_reasoning_summary type=string" /tmp/catalog.txt
          grep -q "detailed" /tmp/catalog.txt
      - name: Validate current-schema smoke fixture from cache
        run: codex-tui validate --config tests/fixtures/config.current-smoke.toml
